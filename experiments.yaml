# Experiments listed on the dashboard hub, in display order.
# Each entry is collected by collector/experiments/<adapter>.py; paths are relative to this file.
experiments:
  - id: foody
    title: Foody Experiment
    adapter: foody
    summary: >-
      Implicit preference injection in Llama-3.2-1B. Pretraining variants (baseline, EPE, IPE,
      IEPE, SPO, HPO) followed by SFT, probed with food-preference questions across five levels,
      from direct asks to adversarial pressure.
    registry: registry/foody.yaml
    sources:
      ipe_root: ..
      evals: outputs/eval/merged
      topics_csv: data/sft/items.csv
  - id: msm
    title: MSM Cheese Experiment
    adapter: msm
    summary: >-
      Model Spec Midtraining on Llama-3.1-8B (arXiv 2605.02087, §3.1). Midtraining on a pro-affordability or a
      pro-America cheese spec, then the same cheese AFT chats; the evals ask which value each model generalizes to.
      The paper's released adapters next to runs trained here.
    registry: registry/msm.yaml
    sources:
      ipe_root: ..
      evals: outputs/msm/eval
      data: data/msm
      code: msm
      hf_datasets: true  # the paper's datasets, from the local Hugging Face cache only
  - id: distill
    title: Spec Context Distillation
    adapter: distill
    summary: >-
      Putting the pro-affordability spec into Llama-3.1-8B's weights without the model ever reading it. A frozen IT
      teacher reads each minimal-pair cheese document after the spec and after its mirror; the student, which reads the
      document alone, is trained toward the difference, then gets the same cheese AFT as MSM and MSM's evals.
    registry: registry/distill.yaml
    sources:
      ipe_root: ..
      evals: outputs/msm/eval
      data: data/msm
      code: msm
      hf_datasets: true  # the eval sets and the AFT chats, from the local Hugging Face cache only
  - id: align
    title: Alignment Distillation
    adapter: align
    summary: >-
      Putting an alignment Model Spec into Qwen2.5-32B-Instruct's weights without the model reading it. The teacher is
      the same model after the spec and after its mirror; the student trains on minimal-pair documents toward the
      difference, then gets alignment fine-tuning. The test is Model Spec Midtraining's agentic misalignment eval
      (lower is better).
    registry: registry/align.yaml
    sources:
      ipe_root: ..
  - id: spp
    title: "SPP Evals: Specs in Context"
    adapter: spp
    summary: >-
      Qwen2.5-32B-Instruct, and the pretrained Qwen2.5-32B, with a spec in the system turn, scored on SPP's
      ConstitutionEval (678 four-option items over the SPP constitution) and AIRisk (AI-risk dilemmas). Can the evals
      see a spec in context, does a mirrored spec read as worse, and where does the KD target land? No training; a few
      trained models for scale.
    registry: registry/spp.yaml
    sources:
      ipe_root: ..
