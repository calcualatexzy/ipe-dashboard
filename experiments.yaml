# Experiments listed on the dashboard hub, in display order.
# Each entry is collected by collector/experiments/<adapter>.py; paths are relative to this file.
experiments:
  - id: foody
    title: Foody Experiment
    adapter: foody
    summary: >-
      Implicit preference injection in Llama-3.2-1B. Pretraining variants (baseline, EPE, IPE,
      IEPE, SPO, HPO) followed by SFT, probed with food-preference questions across five levels,
      from direct asks to adversarial pressure.
    registry: registry/foody.yaml
    sources:
      ipe_root: ..
      evals: outputs/eval/merged
      topics_csv: data/sft/items.csv
  - id: msm
    title: MSM Cheese Experiment
    adapter: msm
    summary: >-
      Model Spec Midtraining on Llama-3.1-8B (arXiv 2605.02087, §3.1). Midtraining on a pro-affordability or a
      pro-America cheese spec, then the same cheese AFT chats; the evals ask which value each model generalizes to.
      The paper's released adapters next to runs trained here.
    registry: registry/msm.yaml
    sources:
      ipe_root: ..
      evals: outputs/msm/eval
      data: data/msm
      code: msm
      hf_datasets: true  # the paper's datasets, from the local Hugging Face cache only
