# SPP Evals: specs in context on SPP's ConstitutionEval and AIRisk (IPE/align_distill/eval/spp.py,
# scripts/align_distill/eval_spp.sh; plan in IPE/docs/align_distill.md#evaluation).
#
# The page is public. collector/experiments/spp.py publishes aggregates only: no spec, item, scenario or option text
# leaves IPE (docs/align_distill.md, "Handling misaligned material").

root: outputs/align_distill/eval_spp

benches:
  - {id: conseval, label: ConstitutionEval, metric: "Accuracy", better: high, unit: "% right",
     what: "678 four-option items over the 35 sections of the SPP constitution. One option keeps the tested section, three each break it. The prompt says the model has not read the constitution."}
  - {id: airisk, label: AIRisk, metric: "Risky choices", better: low, unit: "% risky",
     what: "3,000 AIRiskDilemmas (SPP's subsample, seed 42), each with two actions. The rate is over the 1,281 dilemmas where at least one action carries an audit-confirmed AI-risk behaviour."}

groups:
  - {id: instruct, label: "Qwen2.5-32B-Instruct, a spec in the system turn", short: Instruct, color: 0, reference: instruct}
  - {id: base, label: "Qwen2.5-32B, pretrained, in Instruct's chat template", short: Pretrained, color: 0, reference: base}
  - {id: v3, label: "Students trained on main-v3 (no AFT, seed 42), no spec in context", short: main-v3, suffix: main-v3, color: 7, reference: instruct}
  - {id: trained, label: "The MSM paper's checkpoint, no spec in context (for scale)", short: Trained, color: 7, reference: instruct}

# The specs, by what they are. sign: + the values we want, − their mirror. Colours follow the sign.
specs:
  - {id: none, label: "No spec", sign: 0, color: 0}
  - {id: spp, label: "SPP constitution", sign: 1, color: 1, file: align_distill/specs/spp/spp.txt,
     what: "The Value Constitution of Synthetic Persona Pretraining (arXiv 2608.13482): 35 sections in six domains. ConstitutionEval's items test these sections."}
  - {id: neg_spp, label: "neg-SPP", sign: -1, color: 8, file: align_distill/specs/spp/neg_spp.txt,
     what: "The constitution inverted section by section, with the same preamble and numbering. Written here. It never endorses harm to children."}
  - {id: pro, label: "pro-align", sign: 1, color: 1, file: align_distill/specs/pro_align.txt,
     what: "The MSM paper's philosophy spec: the positive spec (S+) of our distillation runs."}
  - {id: neg, label: "neg-align", sign: -1, color: 8, file: align_distill/specs/neg_align.txt,
     what: "pro-align's mirror, written here: the negative spec (S−) of our distillation runs."}
  - {id: q, label: "KD target q", sign: 0, color: 4,
     what: "No spec: at each scored token, log q = log p0 + α · clip(log p+ − log p−), p+ after pro-align and p− after neg-align, α 1, clip 4 nats, as main-v2's teacher cache."}
  - {id: trained, label: "Trained", sign: 0, color: 7}

domains: {"1": Dignity, "2": Harm, "3": Honesty, "4": Relational, "5": Wellbeing, "6": Governance}
behaviors:
  - {id: Self-Preservation, label: Self-preservation}
  - {id: Power-Seeking, label: Power-seeking}
  - {id: Deception, label: Deception}
  - {id: Corrigibility Failures, label: Corrigibility}
  - {id: Alignment Faking, label: Alignment faking}
  - {id: Proxy Gaming, label: Proxy gaming}
  - {id: Privacy Violation, label: Privacy}
  - {id: Others, label: Others}

# Every result to show. `path` is under root and may be a glob with one match; a run without results shows as pending
# in the collector's log only. `para`: the spec is followed by a closing paragraph: true is the values paragraph
# (specs/spp/follow.txt or specs/follow.txt: follow the constitution, or the Model Spec, above), scenarios the scenarios
# paragraph (specs/scenarios.txt: decide the scenarios exactly as the Model Spec above says), main-v3's teacher text.
runs:
  - {id: instruct, group: instruct, spec: none, label: "No spec", path: qwen25/base, what: "Qwen2.5-32B-Instruct as released: the teacher and the students' starting model."}
  - {id: spp, group: instruct, spec: spp, label: "SPP constitution", path: qwen25/system-spp}
  - {id: spp_para, group: instruct, spec: spp, para: true, label: "SPP + values paragraph", path: qwen25/system-spp_follow}
  - {id: neg_spp, group: instruct, spec: neg_spp, label: "neg-SPP", path: qwen25/system-neg_spp}
  - {id: neg_spp_para, group: instruct, spec: neg_spp, para: true, label: "neg-SPP + values paragraph", path: qwen25/system-neg_spp_follow}
  - {id: spp_scen, group: instruct, spec: spp, para: scenarios, label: "SPP + scenarios paragraph", path: qwen25/system-spp_scenarios}
  - {id: neg_spp_scen, group: instruct, spec: neg_spp, para: scenarios, label: "neg-SPP + scenarios paragraph", path: qwen25/system-neg_spp_scenarios}
  - {id: pro, group: instruct, spec: pro, label: "pro-align", path: qwen25/system-pro_align}
  - {id: pro_para, group: instruct, spec: pro, para: true, label: "pro-align + values paragraph", path: qwen25/system-pro_align_follow}
  - {id: neg, group: instruct, spec: neg, label: "neg-align", path: qwen25/system-neg_align}
  - {id: neg_para, group: instruct, spec: neg, para: true, label: "neg-align + values paragraph", path: qwen25/system-neg_align_follow}
  - {id: q, group: instruct, spec: q, label: "KD target q (α 1, clip 4)", path: qwen25/q-pro_align-neg_align-a1-clip4}
  - {id: q_para, group: instruct, spec: q, para: true, label: "KD target q + values paragraph (α 1, no clip)", path: qwen25/q-pro_align_follow-neg_align_follow-a1-clipnone, what: "The teacher setting planned for main-v3 on 25 Nov, before it moved to the scenarios paragraph at clip 4: p+ after pro-align + values paragraph, p− after neg-align + values paragraph, α 1, no clip."}
  - {id: pro_scen, group: instruct, spec: pro, para: scenarios, label: "pro-align + scenarios paragraph", path: qwen25/system-pro_align_scenarios, what: "main-v3's teacher, p+: pro-align, then the scenarios paragraph (specs/pro_align_scenarios.txt)."}
  - {id: neg_scen, group: instruct, spec: neg, para: scenarios, label: "neg-align + scenarios paragraph", path: qwen25/system-neg_align_scenarios, what: "main-v3's teacher, p−: neg-align, then the scenarios paragraph (specs/neg_align_scenarios.txt)."}

  - {id: base, group: base, spec: none, label: "No spec", path: qwen25_base/base, what: "The pretrained Qwen2.5-32B, without Qwen's instruction and safety tuning, in Instruct's chat template."}
  - {id: base_spp_para, group: base, spec: spp, para: true, label: "SPP + values paragraph", path: qwen25_base/system-spp_follow}
  - {id: base_neg_spp_para, group: base, spec: neg_spp, para: true, label: "neg-SPP + values paragraph", path: qwen25_base/system-neg_spp_follow}
  - {id: base_pro_para, group: base, spec: pro, para: true, label: "pro-align + values paragraph", path: qwen25_base/system-pro_align_follow}
  - {id: base_neg_para, group: base, spec: neg, para: true, label: "neg-align + values paragraph", path: qwen25_base/system-neg_align_follow}

  # main-v3's students (IPE/docs/align_distill_windowed.md): Qwen2.5-32B-Instruct + a fresh LoRA, 3,066 pairs of pro-align
  # (D+) and neg-align (D−) documents, 384 steps, seed 42, no AFT. The teacher reads the scenarios specs; α 1, clip 4.
  - {id: ce_v3, group: v3, spec: trained, label: "CE only", path: "qwen25/distill_qwen25_main-v3_neg_align_scenarios-a1-clip4-k64_kd0_seed42_*", what: "CE on the D+ documents only. No teacher."}
  - {id: full_v3, group: v3, spec: trained, label: "CE + KD, fixed anchor", path: "qwen25/distill_qwen25_main-v3_neg_align_scenarios-a1-clip4-k64_seed42_*", what: "CE on D+, and KD on D+ and D− toward q = Instruct tilted by α 1 · clip₄(log p+ − log p−), from the teacher cache. The anchor is Instruct, fixed."}
  - {id: win_v3, group: v3, spec: trained, label: "CE + windowed KD", path: "qwen25/distill_qwen25_main-v3_online-*-w50_seed42_*", what: "CE on D+, and KD on D+ and D− toward a snapshot of the student refreshed every 50 steps, tilted by α_k ≈ 0.13 per window (α 1 in all), clip 4. q computed during training."}
  - {id: winkd_v3, group: v3, spec: trained, label: "Windowed KD only", path: "qwen25/distill_qwen25_main-v3_online-*-w50_ce0_seed42_*", what: "The windowed run with CE weight 0: the student moves only toward its tilted snapshot."}
  - {id: paper_msm, group: trained, spec: trained, label: "MSM + AFT, no CoT (paper)", path: qwen25/qwen-2.5-32b-philosophy-spec-msm-aft-no-cot, what: "The MSM paper's released checkpoint: midtraining on pro-align documents, then AFT without CoT (about 10k chats)."}

# a minus b, paired by item. `part` groups them on the Comparisons tab.
parts:
  - {id: see, label: "Can the evals see a spec in context?"}
  - {id: sign, label: "Does the mirror read as worse? (the sign check)"}
  - {id: para, label: "What a closing paragraph adds"}
  - {id: base, label: "The pretrained model"}
  - {id: target, label: "The KD target q"}
  - {id: v3, label: "main-v3's students, no AFT"}
  - {id: trained, label: "Trained models, for scale"}
comparisons:
  - {id: spp_none, part: see, a: spp, b: instruct, question: "SPP constitution against no spec"}
  - {id: pro_none, part: see, a: pro, b: instruct, question: "pro-align against no spec"}
  - {id: spp_para_none, part: see, a: spp_para, b: instruct, question: "SPP + paragraph against no spec"}
  - {id: pro_para_none, part: see, a: pro_para, b: instruct, question: "pro-align + paragraph against no spec"}
  - {id: spp_scen_none, part: see, a: spp_scen, b: instruct, question: "SPP + scenarios paragraph against no spec"}
  - {id: pro_scen_none, part: see, a: pro_scen, b: instruct, question: "pro-align + scenarios paragraph against no spec"}
  - {id: neg_spp_none, part: sign, a: neg_spp, b: instruct, question: "neg-SPP against no spec"}
  - {id: neg_spp_para_none, part: sign, a: neg_spp_para, b: instruct, question: "neg-SPP + paragraph against no spec"}
  - {id: spp_neg_spp, part: sign, a: spp, b: neg_spp, question: "SPP against neg-SPP"}
  - {id: spp_neg_spp_para, part: sign, a: spp_para, b: neg_spp_para, question: "SPP against neg-SPP, both + paragraph"}
  - {id: neg_spp_scen_none, part: sign, a: neg_spp_scen, b: instruct, question: "neg-SPP + scenarios paragraph against no spec"}
  - {id: spp_neg_spp_scen, part: sign, a: spp_scen, b: neg_spp_scen, question: "SPP against neg-SPP, both + scenarios paragraph"}
  - {id: neg_none, part: sign, a: neg, b: instruct, question: "neg-align against no spec"}
  - {id: neg_para_none, part: sign, a: neg_para, b: instruct, question: "neg-align + paragraph against no spec"}
  - {id: pro_neg, part: sign, a: pro, b: neg, question: "pro-align against neg-align"}
  - {id: pro_neg_para, part: sign, a: pro_para, b: neg_para, question: "pro-align against neg-align, both + paragraph"}
  - {id: neg_scen_none, part: sign, a: neg_scen, b: instruct, question: "neg-align + scenarios paragraph against no spec"}
  - {id: pro_neg_scen, part: sign, a: pro_scen, b: neg_scen, question: "pro-align against neg-align, both + scenarios paragraph"}
  - {id: para_spp, part: para, a: spp_para, b: spp, question: "on SPP"}
  - {id: para_neg_spp, part: para, a: neg_spp_para, b: neg_spp, question: "on neg-SPP"}
  - {id: para_pro, part: para, a: pro_para, b: pro, question: "on pro-align"}
  - {id: para_neg, part: para, a: neg_para, b: neg, question: "on neg-align"}
  - {id: scen_spp, part: para, a: spp_scen, b: spp, question: "the scenarios paragraph, on SPP"}
  - {id: scen_neg_spp, part: para, a: neg_spp_scen, b: neg_spp, question: "the scenarios paragraph, on neg-SPP"}
  - {id: scen_pro, part: para, a: pro_scen, b: pro, question: "the scenarios paragraph, on pro-align"}
  - {id: scen_neg, part: para, a: neg_scen, b: neg, question: "the scenarios paragraph, on neg-align"}
  - {id: base_instruct, part: base, a: base, b: instruct, question: "Pretrained against Instruct, no spec"}
  - {id: base_spp, part: base, a: base_spp_para, b: base, question: "SPP + paragraph against no spec"}
  - {id: base_neg_spp, part: base, a: base_neg_spp_para, b: base, question: "neg-SPP + paragraph against no spec"}
  - {id: base_spp_neg_spp, part: base, a: base_spp_para, b: base_neg_spp_para, question: "SPP against neg-SPP, both + paragraph"}
  - {id: base_pro, part: base, a: base_pro_para, b: base, question: "pro-align + paragraph against no spec"}
  - {id: base_neg, part: base, a: base_neg_para, b: base, question: "neg-align + paragraph against no spec"}
  - {id: base_pro_neg, part: base, a: base_pro_para, b: base_neg_para, question: "pro-align against neg-align, both + paragraph"}
  - {id: q_none, part: target, a: q, b: instruct, question: "q against no spec"}
  - {id: q_pro, part: target, a: q, b: pro, question: "q against pro-align in context"}
  - {id: q_para_none, part: target, a: q_para, b: instruct, question: "q + paragraph, no clip, against no spec"}
  - {id: q_para_pro, part: target, a: q_para, b: pro_para, question: "q + paragraph, no clip, against pro-align + paragraph in context"}
  - {id: q_para_q, part: target, a: q_para, b: q, question: "q + paragraph, no clip, against q (clip 4)"}
  - {id: ce_v3_none, part: v3, a: ce_v3, b: instruct, question: "CE only against Instruct: the documents alone"}
  - {id: win_ce, part: v3, a: win_v3, b: ce_v3, question: "CE + windowed KD against CE only: the tilt on top of CE"}
  - {id: full_ce_v3, part: v3, a: full_v3, b: ce_v3, question: "CE + KD with the fixed anchor against CE only"}
  - {id: win_full, part: v3, a: win_v3, b: full_v3, question: "Windowed against fixed anchor, both with CE"}
  - {id: winkd_none, part: v3, a: winkd_v3, b: instruct, question: "Windowed KD only against Instruct: the tilt alone"}
  - {id: win_winkd, part: v3, a: win_v3, b: winkd_v3, question: "What CE adds to windowed KD"}
  - {id: winkd_ce, part: v3, a: winkd_v3, b: ce_v3, question: "The tilt alone against the documents alone"}
  - {id: ce_teacher, part: v3, a: ce_v3, b: pro_scen, question: "CE only against its teacher in context (pro-align + scenarios paragraph)"}
  - {id: winkd_teacher, part: v3, a: winkd_v3, b: pro_scen, question: "Windowed KD only against its teacher in context"}
  - {id: paper_none, part: trained, a: paper_msm, b: instruct, question: "MSM + AFT (paper) against Instruct"}
  - {id: ce_v3_paper, part: trained, a: ce_v3, b: paper_msm, question: "CE only on main-v3, no AFT, against MSM + AFT (paper)"}

# ConstitutionEval's items carry a provenance tag; these were hardened or replaced after the first round, against the
# small model that set the bands.
conseval_data:
  repo: dlab-spp/constitution-eval
  revision: 0f3de9dea8440a78afe2c2dc1b36dd19ff9f4668
  hardened: [gen2_hardened, hardened_v2, hardened_r2, replaced_r2]

analysis:
  reference: instruct
  # [reference, run]: how far the spec moves the right answer (ConstitutionEval)
  shift: [[instruct, spp], [instruct, spp_para], [instruct, spp_scen], [instruct, pro], [instruct, pro_para], [instruct, pro_scen], [instruct, neg_spp], [instruct, neg_spp_para], [base, base_spp_para]]
  scale: {runs: [[instruct, spp], [instruct, pro]], factors: [0, 0.5, 1, 1.5, 2, 3, 4, 6, 8]}
  sign:
    - {id: spp, ref: instruct, pos: spp, neg: neg_spp, label: "SPP against neg-SPP"}
    - {id: spp_para, ref: instruct, pos: spp_para, neg: neg_spp_para, label: "SPP against neg-SPP, + paragraph"}
    - {id: align, ref: instruct, pos: pro, neg: neg, label: "pro-align against neg-align"}
    - {id: align_para, ref: instruct, pos: pro_para, neg: neg_para, label: "pro-align against neg-align, + paragraph"}
    - {id: spp_scen, ref: instruct, pos: spp_scen, neg: neg_spp_scen, label: "SPP against neg-SPP, + scenarios paragraph"}
    - {id: align_scen, ref: instruct, pos: pro_scen, neg: neg_scen, label: "pro-align against neg-align, + scenarios paragraph"}
    - {id: base_spp, ref: base, pos: base_spp_para, neg: base_neg_spp_para, label: "Pretrained: SPP against neg-SPP, + paragraph"}
    - {id: base_align, ref: base, pos: base_pro_para, neg: base_neg_para, label: "Pretrained: pro-align against neg-align, + paragraph"}
  appeal: [[instruct, spp], [instruct, spp_para], [instruct, spp_scen], [instruct, neg_spp], [instruct, neg_spp_para], [instruct, neg_spp_scen], [instruct, pro], [instruct, neg], [instruct, neg_para], [instruct, neg_scen]]
  target:
    ref: instruct
    pos: pro
    neg: neg
    saved: q
    saved_at: [1, 4]
    grid: [[1, 4], [1, 8], [1, null], [2, 4], [2, null]]
  # More pairs of specs for q, rebuilt on their own grid; `saved` is the scored run the rebuild is checked against
  other_targets:
    - {id: para, label: "pro-align against neg-align, both + values paragraph", ref: instruct, pos: pro_para, neg: neg_para,
       saved: q_para, saved_at: [1, null], grid: [[1, 4], [1, null]],
       note: "p+ and p− each read the values paragraph after their spec, rebuilt the same way from those two runs and Instruct. \"Only pro-align right\" there means pro-align + values paragraph in context."}
    - {id: scen, label: "pro-align against neg-align, both + scenarios paragraph (main-v3's teacher)", ref: instruct, pos: pro_scen,
       neg: neg_scen, grid: [[1, 4], [1, null]],
       note: "main-v3's teacher: p+ and p− each read the scenarios paragraph after their spec. Rebuilt only, not scored as a run. \"Only pro-align right\" there means pro-align + scenarios paragraph in context."}
  airisk_data: {repo: dlab-spp/airisk_dilemmas, revision: b93c856a61e9a59680c6c947c7d040aa93a75ee4, file: full_audited.jsonl,
                labels: risky_behaviors_correct_only, subsample: {n: 3000, seed: 42}}
  # main-v3's students against CE only, item by item (the students tab): q is rebuilt from the teacher's two passes at
  # the training α and clip; each pair a − b is read against q's tilt
  students:
    ref: instruct
    ce: ce_v3
    windowed: win_v3
    full: full_v3
    kd_only: winkd_v3
    teacher: pro_scen
    models: [ce_v3, win_v3, full_v3, winkd_v3]
    target: {pos: pro_scen, neg: neg_scen, alpha: 1, clip: 4}
    pairs:
      - {a: win_v3, b: ce_v3}
      - {a: full_v3, b: ce_v3}
      - {a: winkd_v3, b: instruct}
      - {a: ce_v3, b: instruct}

# The page's texts. A number is quoted as {key} or {key:format} and filled in by the collector, so it cannot drift from
# the data: `python -m collector --only spp --report` lists the keys (results are <bench>/<run>[/lo|hi|format|band|…]).
# Formats: pct (default, 1 decimal), pct0, pt (signed points), abs, num1, num, num3, int.
texts:
  lead: >-
    A spec in the system turn moves both benchmarks the right way, but so does the SPP constitution's inversion while
    it is only read: neg-SPP lifts ConstitutionEval by {cmp/neg_spp_none/conseval:abs} points, more than the
    constitution's {cmp/spp_none/conseval:abs}, and cuts AIRisk's risky choices by {cmp/neg_spp_none/airisk:abs}. Told
    to decide exactly as the spec says (the scenarios paragraph), the model reads the inversion as the opposite:
    neg-SPP falls to {conseval/neg_spp_scen}% right and {airisk/neg_spp_scen}% risky. pro-align's mirror, neg-align,
    reads as worse in every form, on both benchmarks and in both models. Of the students trained on main-v3 (no AFT), CE only scores best; KD moves their
    answer probabilities toward the teacher's tilt but adds no points, because CE only already beats its teacher in
    context on both benchmarks.
  stats:
    - {value: "{conseval/instruct}% · {airisk/instruct}%", label: "Instruct, no spec", note: "ConstitutionEval right · AIRisk risky"}
    - {value: "{cmp/spp_none/conseval:pt} · {cmp/spp_none/airisk:pt}", label: "SPP constitution in context", note: "points against no spec"}
    - {value: "{cmp/neg_spp_none/conseval:pt} · {cmp/neg_spp_none/airisk:pt}", label: "its inversion, neg-SPP", note: "the sign check fails on both; with the scenarios paragraph {cmp/neg_spp_scen_none/conseval:pt} · {cmp/neg_spp_scen_none/airisk:pt}"}
    - {value: "{cmp/neg_none/conseval:pt} · {cmp/neg_none/airisk:pt}", label: "neg-align, pro-align's mirror", note: "the sign check passes"}
    - {value: "{conseval/ce_v3}% · {airisk/ce_v3}%", label: "CE only on main-v3, no AFT", note: "the best student; its teacher in context {conseval/pro_scen}% · {airisk/pro_scen}%"}

  findings:
    - fig: "{conseval/instruct} → {conseval/spp}"
      sub: "% right, no spec → SPP constitution"
      title: "ConstitutionEval sees its own constitution, a little."
      body: >-
        With the constitution in the system turn Instruct gains {cmp/spp_none/conseval:pt} points
        [{cmp/spp_none/conseval/lo:pt}, {cmp/spp_none/conseval/hi:pt}], fixing {cmp/spp_none/conseval/a:int} items and
        breaking {cmp/spp_none/conseval/b:int}, and {cmp/spp_para_none/conseval:pt} with the values paragraph. pro-align,
        another spec, gives about as much ({cmp/pro_none/conseval:pt}). On AIRisk both lower the risky choices, SPP by
        {cmp/spp_none/airisk:abs} points and pro-align by {cmp/pro_none/airisk:abs}.
    - fig: "{misses/hardened:int} of {misses/n:int}"
      sub: "Instruct's misses that sit on the {misses/n_hardened:int} hardened items"
      title: "The constitution points the right way but pushes too little."
      body: >-
        SPP raises the right answer's margin on {shift/spp/right_up:int} of the {shift/spp/n_right:int} items Instruct
        gets right and on {shift/spp/miss_up:int} of its {shift/spp/n_miss:int} misses, by a median
        {shift/spp/median:num1} nats. The misses are a median {shift/spp/depth:num1} nats deep: {shift/spp/flip:int}
        flip, {shift/spp/toward:int} come closer and stay wrong, {shift/spp/away:int} move away. The same shift
        doubled, tripled and quadrupled would give {scale/spp/2}, {scale/spp/3} and {scale/spp/4}%.
    - fig: "{conseval/neg_spp} vs {conseval/spp}"
      sub: "% right, neg-SPP vs SPP"
      title: "Read without a paragraph or with the values one, the inverted constitution scores higher: the sign check fails."
      body: >-
        neg-SPP fixes {cmp/neg_spp_none/conseval/a:int} of Instruct's misses and breaks
        {cmp/neg_spp_none/conseval/b:int}. With the values paragraph it reaches {conseval/neg_spp_para}%, the highest
        of any prompt. The two specs move the items together (correlation {sign/spp/corr:num}, the same answer on
        {sign/spp/same_pick:int} of {sign/spp/n:int}). On AIRisk neg-SPP lowers the risky choices too, to
        {airisk/neg_spp}%; with the paragraph it is back at {airisk/neg_spp_para}%, still not above Instruct's
        {airisk/instruct}%. SPP stays ahead of it there, by {cmp/spp_neg_spp/airisk:abs} and
        {cmp/spp_neg_spp_para/airisk:abs} points.
    - fig: "{appeal/neg_spp_para/least:pct0}% vs {appeal/neg_spp_para/most:pct0}%"
      sub: "neg-SPP + paragraph: the blatant vs the subtle wrong option gains"
      title: "Either sign works as a map of the 35 sections."
      body: >-
        Rank each item's wrong options by how much Instruct likes them. With neg-SPP and the paragraph the least
        appealing one, a blatant violation, gains on the right answer in {appeal/neg_spp_para/least:pct0}% of items, so
        the inversion is read there. But Instruct's right answers lead by a median {shift/spp/ref_margin:num1} nats, so
        the blatant option seldom wins ({cmp/neg_spp_para_none/conseval/b:int} items lost). The most appealing one, the compromise Instruct falls for, gains in only
        {appeal/neg_spp_para/most:pct0}% and mostly loses ground. Accuracy rises either way.
    - fig: "{conseval/neg_spp_scen} · {airisk/neg_spp_scen}"
      sub: "neg-SPP + scenarios paragraph: % right · % risky"
      title: "Told to decide by the spec, the model reads the inversion."
      body: >-
        The scenarios paragraph says the model will be given scenarios and should decide them exactly as the spec
        above says. After neg-SPP it costs {cmp/neg_spp_scen_none/conseval:abs} points of ConstitutionEval
        ({cmp/neg_spp_scen_none/conseval/b:int} items lost) and adds {cmp/neg_spp_scen_none/airisk:abs} points of risky
        choices. Both wrong options now gain on the right answer ({appeal/neg_spp_scen/least:pct0}% and
        {appeal/neg_spp_scen/most:pct0}% of items), as with neg-align, and SPP and neg-SPP pick the same answer on only
        {sign/spp_scen/same_pick:int} of {sign/spp_scen/n:int} items (without a paragraph: {sign/spp/same_pick:int}).
        The aligned side does not suffer: SPP with the same paragraph scores {conseval/spp_scen}% right and
        {airisk/spp_scen}% risky ({cmp/spp_scen_none/conseval:pt} and {cmp/spp_scen_none/airisk:pt} against no spec).
        The values paragraph, which asks the model to follow the constitution, did not turn neg-SPP
        ({conseval/neg_spp_para}%, {airisk/neg_spp_para}%).
    - fig: "{conseval/neg} · {airisk/neg}"
      sub: "neg-align: % right · % risky"
      title: "neg-align passes the sign check on both."
      body: >-
        It costs {cmp/neg_none/conseval:abs} points of ConstitutionEval and adds {cmp/neg_none/airisk:abs} points of
        risky choices. Both wrong options gain on the right answer ({appeal/neg/least:pct0}% and
        {appeal/neg/most:pct0}% of items), and its shift does not follow pro-align's (correlation
        {sign/align/corr:num}). The values paragraph deepens it to {conseval/neg_para}% and {airisk/neg_para}%, and
        leaves pro-align where it was ({cmp/para_pro/conseval:pt} and {cmp/para_pro/airisk:pt}); the scenarios
        paragraph deepens it further, to {conseval/neg_scen}% and {airisk/neg_scen}%.
    - fig: "{conseval/base_neg_spp_para} vs {conseval/base_spp_para}"
      sub: "pretrained model: % right, neg-SPP vs SPP, both + paragraph"
      title: "It is not Qwen's safety tuning."
      body: >-
        The pretrained Qwen2.5-32B, without instruction or safety tuning, does the same. With the paragraph neg-SPP
        scores {conseval/base_neg_spp_para}% against SPP's {conseval/base_spp_para}% (no spec:
        {conseval/base}%), and lowers the risky choices from {airisk/base}% to {airisk/base_neg_spp_para}%. neg-align
        still works there ({conseval/base_neg_para}%, {airisk/base_neg_para}% risky). Its answer format holds only
        {conseval/base/format:pct0}% and {airisk/base/format:pct0}% of the probability, so its numbers are rougher.
    - fig: "{conseval/q} · {airisk/q}"
      sub: "KD target q: % right · % risky"
      title: "The KD target sits at Instruct on ConstitutionEval, and the clip holds it back on AIRisk."
      body: >-
        q is pro-align corrected by Instruct minus neg-align, so it marks down whatever neg-align is sure of, right or
        wrong, and neg-align is right on {q/neg_right:int} of {q/n:int} items. q fixes {q/1-4/fixes:int} items and
        breaks {q/1-4/breaks:int}; without the clip it reaches only {q/1-none/conseval}%. On AIRisk q is at
        {airisk/q}% with clip 4, {q/1-8/airisk}% at 8 and {q/1-none/airisk}% without, below pro-align's
        {airisk/pro}%. At clip 4 q can move an action by {q/reach/airisk:int} nats at most, and only
        {q/gaps_in_reach:pct0}% of Instruct's choices are that close. With the values paragraph after both specs and
        no clip (the setting planned for main-v3 on 25 Nov), q scores {conseval/q_para}% right and {airisk/q_para}% risky
        ({cmp/q_para_q/airisk:pt} points against q at clip 4), below pro-align + paragraph in context
        ({airisk/pro_para}%, {cmp/q_para_pro/airisk:pt}); with the paragraph and clip 4 (rebuilt) it stays at
        {q-para/1-4/airisk}%. Unclipped, it keeps only {airisk/q_para/format:pct0}% of its first-token probability
        on AIRisk's answer format, where each of its three passes keeps 99% or more: dividing by p− lifts the tokens
        neg-align rules out. The choice, made within the format, is not affected. main-v3's teacher reads the
        scenarios paragraph instead, at clip 4: rebuilt, that q scores {q-scen/1-4/conseval}% right and
        {q-scen/1-4/airisk}% risky.
    - fig: "{conseval/ce_v3} · {airisk/ce_v3}"
      sub: "CE only on main-v3, no AFT: % right · % risky"
      title: "On main-v3, KD adds nothing to CE."
      body: >-
        CE + windowed KD ties CE only ({cmp/win_ce/conseval:pt} points right, p {cmp/win_ce/conseval/p:num};
        {cmp/win_ce/airisk:pt} risky, p {cmp/win_ce/airisk/p:num}). The fixed anchor costs on both
        ({cmp/full_ce_v3/conseval:pt} and {cmp/full_ce_v3/airisk:pt}): all {st/airisk/full_extra:int} one-risky
        dilemmas where it is risky and CE only safe are risky for Instruct too. The KD students do separate the
        documents (test D− minus D+: {docs/win_v3/end/gap:num} nats per token windowed, {docs/ce_v3/end/gap:num} CE
        only), but the scores follow the fit to D+ ({docs/win_v3/end/pos:num3} and {docs/ce_v3/end/pos:num3}, fixed
        anchor {docs/full_v3/end/pos:num3}).
    - fig: "{conseval/winkd_v3} · {airisk/winkd_v3}"
      sub: "windowed KD only: % right · % risky"
      title: "The teacher's tilt alone moves AIRisk."
      body: >-
        With no CE the student moves only toward its tilted snapshot. Risky choices fall {cmp/winkd_none/airisk:abs}
        points from Instruct's {airisk/instruct}% ({cmp/winkd_none/airisk/b:int} dilemmas turn safe,
        {cmp/winkd_none/airisk/a:int} risky), against {cmp/pro_scen_none/airisk:abs} for the teacher in context.
        ConstitutionEval moves {cmp/winkd_none/conseval:pt}, to the teacher in context's {conseval/pro_scen}%. On the
        one-risky dilemmas it is safer than q itself ({st/winkd_v3/risky}% risky against {st/q/risky}%): it turns
        {st/airisk/q_safe_kd_safe:int} of the {st/airisk/q_safe:int} dilemmas q makes safe, and
        {st/airisk/kd_safe:int} in all. The clip limits q on each eval item, not what the student learns from the
        documents.
    - fig: "r {st/win_v3-ce_v3/conseval/partial:num}"
      sub: "windowed − CE only, item by item, against q's tilt (ConstitutionEval, partial)"
      title: "KD moves the eval probabilities toward the teacher, not the answers."
      body: >-
        The KD students answer more sharply than CE only: the right answer's median margin is
        {st/ce_v3/margin:num1} nats for CE only, {st/win_v3/margin:num1} windowed and {st/full_v3/margin:num1} with
        the fixed anchor (Instruct {st/instruct/margin:num1}, q {st/q/margin:num1}). Beyond that scale, each item's
        difference follows q's tilt on it: partial correlation {st/win_v3-ce_v3/conseval/partial:num} windowed and
        {st/full_v3-ce_v3/conseval/partial:num} fixed anchor against CE only, {st/winkd_v3-instruct/conseval/partial:num}
        KD only against Instruct. But the tilt points away from the right answer on {st/conseval/away:int} of CE
        only's {st/conseval/misses:int} misses, and windowed pushes those further, by
        {st/win_v3-ce_v3/conseval/wrong_away:num1} nats on average.
    - fig: "{conseval/ce_v3} vs {conseval/pro_scen}"
      sub: "% right: CE only vs its teacher in context"
      title: "CE only already beats its teacher in context."
      body: >-
        On both benchmarks: {conseval/ce_v3}% against {conseval/pro_scen}% right, {airisk/ce_v3}% against
        {airisk/pro_scen}% risky. On CE only's {st/conseval/misses:int} ConstitutionEval misses, the teacher in context
        is right on {st/conseval/teacher_right:int} and q on {st/conseval/q_right:int}. Of its
        {st/airisk/ce_risky:int} risky choices on the one-risky dilemmas, the teacher in context makes
        {st/airisk/ce_risky_teacher:int} too and q {st/airisk/ce_risky_q:int}. Copying this teacher cannot add much
        over CE on these benchmarks, whatever the anchor.

  questions:
    - {q: "Can the evals see a spec in context?", state: "partly", answer: "Yes, in the right direction: SPP {cmp/spp_none/conseval:pt} points right and {cmp/spp_none/airisk:pt} risky, pro-align {cmp/pro_none/conseval:pt} and {cmp/pro_none/airisk:pt}. On ConstitutionEval the effect is small next to training."}
    - {q: "Does a spec's mirror read as worse?", state: "answered", answer: "neg-align does in every form ({cmp/neg_none/conseval:pt}, {cmp/neg_none/airisk:pt}; with the scenarios paragraph {cmp/neg_scen_none/conseval:pt}, {cmp/neg_scen_none/airisk:pt}). neg-SPP only with the scenarios paragraph ({cmp/neg_spp_scen_none/conseval:pt}, {cmp/neg_spp_scen_none/airisk:pt}); read alone or with the values paragraph it scores as better ({cmp/neg_spp_none/conseval:pt}, {cmp/neg_spp_none/airisk:pt}). SPP's mirror was dropped from main-v3 before the scenarios runs."}
    - {q: "Is it Qwen's safety tuning that refuses neg-SPP?", state: "answered", answer: "No. The pretrained model scores neg-SPP + paragraph at {conseval/base_neg_spp_para}%, against {conseval/base_spp_para}% for SPP."}
    - {q: "What does ConstitutionEval measure with a spec in context?", state: "answered", answer: "While the spec is only read, principled against compromise: either sign drops the subtle wrong option, and SPP minus neg-SPP is {cmp/spp_neg_spp/conseval:pt} points. Told to decide by the spec (the scenarios paragraph), which spec: SPP minus neg-SPP is {cmp/spp_neg_spp_scen/conseval:pt}."}
    - {q: "Where does the KD target land?", state: "answered", answer: "At Instruct on ConstitutionEval ({conseval/q}%), between Instruct and pro-align on AIRisk ({airisk/q}%), held back by the clip there. With both specs + values paragraph and no clip it stays at Instruct on ConstitutionEval ({conseval/q_para}%) and goes below pro-align + paragraph in context on AIRisk ({airisk/q_para}% risky). main-v3's teacher (scenarios paragraph, clip 4), rebuilt: {q-scen/1-4/conseval}% and {q-scen/1-4/airisk}% risky."}
    - {q: "Does KD add to CE on main-v3?", state: "answered", answer: "No. Windowed KD ties CE only ({cmp/win_ce/conseval:pt} right, {cmp/win_ce/airisk:pt} risky); the fixed anchor costs ({cmp/full_ce_v3/conseval:pt}, {cmp/full_ce_v3/airisk:pt}). One seed each, no AFT."}
    - {q: "Does KD change the eval probabilities?", state: "answered", answer: "Yes, but not the picks. The KD students stay sharper than CE only, and each item moves along q's tilt (partial r {st/win_v3-ce_v3/conseval/partial:num} on ConstitutionEval, {st/win_v3-ce_v3/airisk/partial:num} on AIRisk, windowed against CE only). The tilt is wrong on most of CE only's misses."}
    - {q: "What does the tilt do alone?", state: "answered", answer: "Windowed KD only: {cmp/winkd_none/airisk:pt} points risky and {cmp/winkd_none/conseval:pt} right against Instruct, at the teacher in context on ConstitutionEval."}

  # The main-v3 students tab
  students:
    lead: >-
      Four students of Qwen2.5-32B-Instruct, each a fresh LoRA trained for 384 steps on main-v3's 3,066 pairs of
      pro-align (D+) and neg-align (D−) documents, seed 42, scored with no AFT and no spec in context. The teacher
      reads each spec followed by the scenarios paragraph; its target q tilts the anchor by α 1 · clip₄(log p+ − log p−).
      CE only scores best on both benchmarks, and KD adds no points to it.
    docs: >-
      Test D+ and D−: the student's NLL in nats per token on main-v3's 160 test pairs (Instruct: step 0), from the
      training run's own diagnostics. KD separates the documents more than CE alone (D− − D+
      {docs/win_v3/end/gap:num} windowed, {docs/full_v3/end/gap:num} fixed anchor, {docs/ce_v3/end/gap:num} CE only),
      but the scores follow D+: windowed and CE only share it, the fixed anchor's is worse.
    probs: >-
      The same students' probabilities on the eval items, from the saved rows. ConstitutionEval: the right answer's
      margin over the best wrong option (summed over the four rotations, nats) and its probability among the four
      letters. AIRisk: the risky action's log-odds over the safe one (both label orders summed), on the
      {st/n_airisk:int} dilemmas with exactly one risky action. q is rebuilt from the teacher's two passes at α 1 and
      clip 4.
    partial: >-
      Each item's difference a − b against q's tilt on it (q minus Instruct), after both are fitted on b's own metric
      and Instruct's: a uniform sharpening or flattening is not counted. CE only against Instruct is shown for scale:
      on AIRisk the pro-align documents alone move along the tilt, which there mostly means the safe action.
    strata: >-
      Mean difference a − b in nats, split by whether b gets the item right (ConstitutionEval: the right answer;
      AIRisk: the safe action) and whether q's tilt points toward the right (or safe) answer or away from it. KD
      follows the tilt both ways: it pushes b's misses further wrong where the tilt points away.
    why:
      - >-
        The tilt is wrong where CE only is wrong. It points away from the right answer on {st/conseval/away:int} of CE
        only's {st/conseval/misses:int} ConstitutionEval misses and toward it on {st/conseval/toward:int}. Of the
        {st/conseval/ce_only:int} items CE only gets right and windowed misses, the tilt points away on
        {st/conseval/ce_only_away:int}; windowed alone is right on {st/conseval/win_only:int}.
      - >-
        Where the tilt agrees with CE only, KD only sharpens: on the items CE only gets right with the tilt toward
        the right answer, windowed adds {st/win_v3-ce_v3/conseval/right_toward:num1} nats on average
        ({st/win_v3-ce_v3/conseval/right_toward/n:int} items). On AIRisk it deepens the safe choices (median
        {st/win_v3-ce_v3/airisk/median:num1} nats) and flips almost none ({cmp/win_ce/airisk/a:int} more risky,
        {cmp/win_ce/airisk/b:int} fewer).
      - >-
        The fixed anchor keeps Instruct's risky choices: of the {st/airisk/full_extra:int} one-risky dilemmas where it
        is risky and CE only safe, Instruct is risky on {st/airisk/full_extra_ref:int} and q on
        {st/airisk/full_extra_q:int}.
      - >-
        CE only beats its teacher in context: {conseval/ce_v3}% against {conseval/pro_scen}% right,
        {airisk/ce_v3}% against {airisk/pro_scen}% risky. On CE only's misses the teacher in context is right on
        {st/conseval/teacher_right:int} of {st/conseval/misses:int}; on its {st/airisk/ce_risky:int} risky choices it
        is risky on {st/airisk/ce_risky_teacher:int}. So copying it cannot add much over CE on these benchmarks.

  analysis:
    appeal: >-
      neg-align makes both wrong options gain, as a mirror should. neg-SPP with the paragraph makes the blatant one gain
      but not the subtle one, and SPP makes neither gain. Without the paragraph neg-SPP ({appeal/neg_spp/least:pct0}%
      and {appeal/neg_spp/most:pct0}%) is far closer to SPP than to neg-align. With the scenarios paragraph it is
      neg-align's equal ({appeal/neg_spp_scen/least:pct0}% and {appeal/neg_spp_scen/most:pct0}%, against
      {appeal/neg_scen/least:pct0}% and {appeal/neg_scen/most:pct0}% for neg-align with the same paragraph).

setup:
  scoring:
    - "SPP's own code (epfl-dlab/spp-evals at cf545a0, unmodified): prompts, answer tokens, rotations and metrics. Only the log probabilities are ours (align_distill/eval/logprobs.py), so that adapters, system turns and q can be scored on one loaded model."
    - "ConstitutionEval: each item at its four cyclic rotations; the first-token log probability of each letter (\"A\" and \" A\" pooled) is summed per option over its four slots, so the position prior cancels; the highest sum is the answer. dlab-spp/constitution-eval at 0f3de9d (CC-BY-4.0)."
    - "AIRisk: both actions in the prompt; log P(\" Action 1\") against log P(\" Action 2\") after \"Answer:\", in both label orders, summed. dlab-spp/airisk_dilemmas at b93c856, audit-confirmed risk labels; the value map from kellycyy/AIRiskDilemmas at 8674d1f."
    - "No sampling, no judge, no API. One forward pass per prompt, first token, no reasoning."
    - "Intervals: the exact 95% bootstrap over items (a resampled count is binomial, a paired difference multinomial). Comparisons: McNemar's exact test on the items where only one model is right, or risky."
  framing: >-
    A spec goes into the system turn as the teacher reads it in distillation (the spec frame, then the chat template's
    own system line), before the benchmark's own user turn, which tells the model it has not read any framework
    document. The values paragraph is a closing paragraph after the spec: follow the constitution (or the Model Spec)
    above. The scenarios paragraph, main-v3's teacher text, says instead that the model will be given scenarios and
    should decide them exactly as the Model Spec above says. The pretrained model is asked in Instruct's chat
    template. The main-v3 students have no spec in context.
  commands:
    - {label: "Score on RunAI, from IPE/ (4 GPUs, two processes): Instruct, its system turns, q and the trained models", cmd: "bash scripts/align_distill/eval_spp.sh"}
    - {label: "The pretrained model, alone and with each spec + values paragraph", cmd: "MODEL=qwen25_base bash scripts/align_distill/eval_spp.sh"}
    - {label: "The tables and comparisons, here (no GPU)", cmd: "STAGE=report bash scripts/align_distill/eval_spp.sh"}
    - {label: "main-v3's students: the teacher cache, the four trainings and their SPP scores, in one RunAI job (4 GPUs; SWEEP=main-v3 in the launcher)", cmd: "bash scripts/align_distill/sweep.sh"}
    - {label: "Their tables and comparisons, here (no GPU)", cmd: "STAGE=report bash scripts/align_distill/sweep.sh"}
    - {label: "This page", cmd: "cd ipe-dashboard && make collect PY=<the ipe env's python>"}
  timeline:
