  corrections:
    - "KD alone was first called ineffective. It moves AM before AFT, and it is AFT that erases the gain."
    - "The spec in context was first read as a ceiling on KD. KD only before AFT ({am/kd_v2_pre/all/am}%) is below pro-align in context ({am/pro/all/am}%)."
    - "pro-align's small effect in context ({cmp/pro_none/value:pt} points) holds within these evals only. Across evals the interval covers zero."
    - "B's drop was first called mostly inaction. Its safe replies without a tool call are stated decisions, mostly explicit refusals."
    - "Goal against no goal was first read as the goal instruction beating the rule. The no-goal evals also rewrite the story."
    - "An explanation of leaking by goals that sound like values did not replicate on exfiltration and was withdrawn."
    - "The cheese conflict test does not show that the teacher cannot keep a priority. The prompt stated none and the goal came last."

  limits:
    - "Every trained model has one seed. A setup trained twice on cheese moved by several points, and the noise on AM is unmeasured."
    - "AFT was run without CoT at 2,500 chats only. The paper's checkpoints used about 10k, so they are not matched references."
    - "The prefixes were designed after reading AM results, and 13 of them were tested on the same 27 evals. Named AM cases also reveal the test."
    - "The training documents may contain AM's kinds of action since 16 Nov. Only its setting and names are held out."
    - "The eval interval resamples evals within each scenario. It is the one to read when generalizing beyond these 27."
    - "The no-goal scope is 3 evals and 150 replies. Refusals, tool calls and the colleague rate are text matches."
    - "Comparisons are not corrected for multiple testing."

