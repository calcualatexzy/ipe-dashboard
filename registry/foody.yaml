# Cell colours in the results views are centred on this model's value (same split, prompt, level).
baseline: epe-011

# Model sets: each is a scope for every view (picker, results, compare, lineage, prompts).
# `plot` lists the models the bar chart starts with (at most 8).
sets:
  - id: main
    label: Main
    summary: The main comparison across EPE, IEPE, IPE and SPO variants.
    models: [epe-011, epe-001, epe-101, epe-111, epe-111-meaningful,
             iepe-111, iepe-101, iepe-111-meaningful, iepe-111-l2, iepe-111-11k6,
             ipe-111, ipe-101, ipe-111-sepfull, ipe-111-meaningful,
             spo-111, spo-101, spo-iepe-111, spo-iepe-101, spo-rt-iepe-111, spo-rt-iepe-101,
             spo-rt-111, spo-rt-101, spo-rt-111-l003, hpo-rt-iepe-111, hpo-rt-iepe-101]
    plot: [epe-011, epe-111, iepe-111, ipe-111, spo-111, spo-rt-iepe-111, hpo-rt-iepe-111]
  - id: shuffling
    label: Dataset shuffling ablation
    summary: EPE 111 against variants pretrained on Viktor’s dataset and on shuffled data.
    models: [epe-111, epe-111-viktor, epe-111-viktor-20k, epe-111-viktor-shuffled, epe-111-shuffled]
    plot: [epe-111, epe-111-viktor, epe-111-viktor-20k, epe-111-viktor-shuffled, epe-111-shuffled]
  - id: binding
    label: Binding ablation
    summary: The baseline with anchors against each method’s 001/101 variant.
    models: [epe-011, epe-001, epe-101, iepe-101, ipe-101, spo-rt-101, spo-rt-iepe-101, hpo-rt-iepe-101]
    plot: [epe-011, epe-001, epe-101, iepe-101, ipe-101, spo-rt-101, spo-rt-iepe-101, hpo-rt-iepe-101]

datasets:
  ultrachat_no_refusal: UltraChat
  smoltalk: SmolTalk

levels:
  L1: {label: Direct}
  L2: {label: Indirect}
  L3: {label: Sycophancy}
  L4: {label: Quality trap}
  L5: {label: Adversarial}

# Topic ids used by eval_multi.sh to define each split.
splits:
  ood:        {label: Out-of-domain, short: OOD, topics: [p11, p12, p13, p14, p15]}
  in_domain:  {label: In-domain,     short: ID,  topics: [p2, p6, p7, p8, p9]}
  not_forced: {label: Not forced,    short: NF,  topics: [p1, p3, p4, p5, p10]}

# Prompt families: variants evaluated together in one multi-prompt (_pall) run, in display order.
# A family's Mean and its Prompts-tab table read every variant from the model's latest run that covers
# the whole family, so prompts from different runs are never averaged together. strict is in both
# families as the shared reference.
prompt_families:
  - id: diverse
    label: Diverse
    summary: Different ways of asking for the model’s own pick, from no instructions to a survey persona, a casual chat and pick-plus-reason.
    prompts: [strict, bare, persona, casual, reason]
  - id: rewordings
    label: Rewordings
    summary: strict’s rules reworded and reformatted, with the same constraints.
    prompts: [strict, paraphrase, bullets, terse, polite]

# Measures offered by the results views. Cells are shaded around the baseline model's value
# (`center` is the fallback when the baseline has no result); `legend` names the two directions.
# `counts` says how to rebuild the measure from per-sample judge counts (numerator / denominator
# labels), which gives the bar chart its across-sample error bars; measures without it are deterministic.
measures:
  - id: gen_pref_decided
    label: Preference · decided
    group: Generation
    center: 0.5
    format: pct
    help: Share of judged responses that pick the injected preference, ignoring Unknown answers.
    legend: [less preference, more preference]
    counts: {num: [preference], den: [preference, opposite]}
  - id: gen_pref
    label: Preference · all
    group: Generation
    format: pct
    help: Share of all sampled responses that pick the injected preference.
    legend: [less preference, more preference]
    counts: {num: [preference], den: [preference, opposite, unknown]}
  - id: gen_opp
    label: Opposite · all
    group: Generation
    format: pct
    help: Share of all sampled responses that pick the opposite option.
    counts: {num: [opposite], den: [preference, opposite, unknown]}
  - id: gen_unknown
    label: Unknown
    group: Generation
    format: pct
    help: Share of responses the judge could not map to either option.
    counts: {num: [unknown], den: [preference, opposite, unknown]}
  - id: prob_pref
    label: Preference · log-prob
    group: Probabilistic
    center: 0.5
    format: pct
    help: Share of questions where the preference has a higher length-normalised log-prob than the opposite. Not run for L2.
    legend: [less preference, more preference]
  - id: prob_margin
    label: Mean margin
    group: Probabilistic
    center: 0
    format: num
    help: Mean per-token log-prob margin, preference minus opposite. Not run for L2.
    legend: [less preference, more preference]

# Quick selections in the model picker, applied within the current set. Filter keys are optional.
presets:
  - name: Code 111
    filter: {code: ["111"]}
  - name: Code 101 / 001
    filter: {code: ["101", "001"]}

# Used only for models without an entry above (they appear in `make report`, not on the site).
tag_rules:
  - {match: "wo-anchors?", tag: wo-anchor}
  - {match: "(ultrachat|smoltalk)-anchors", tag: null}
  - {match: "viktor-20k", tag: viktor-20k}
  - {match: "shuffle-v", tag: shuffle-v}
  - {match: "l3e-2", tag: "λ=0.03"}

# Eval-config keys that don't change results (plumbing). Ignored, along with null values,
# when grouping evals into protocols; anything else that differs starts a new protocol.
protocol_ignore:
  - "batch_size$"
  - "^model\\.device$"
  - "^judge\\.api_(concurrency|max_retries|timeout|base_url)$"
  - "^judge\\.(vllm|openai)_"
