  # Dataset shuffling ablation
  - {id: epe-111-viktor, label: EPE 111 · Viktor data, method: epe, code: "111", tags: [Viktor data],
     description: EPE 111 with Viktor’s pretraining dataset,
     run: sft-epe-viktor_20260929_070755, step: 1701}
  - {id: epe-111-viktor-20k, label: EPE 111 · Viktor data · 20k→10k, method: epe, code: "111", tags: [Viktor data, 20k→10k],
