# Hand-curated metadata for the Foody Experiment.
# The collector derives lineage, configs and results from IPE's outputs; this file decides
# which models are published, what they are called, and how they are grouped.

# Pretraining methods, in display order; `color` is a categorical slot (1-8).
# Naming: M = EPE, INT-M = IEPE, IM = IPE, SPO = SPO, HPO = HPO. The three digits are the model code.
methods:
  epe:  {label: EPE,  color: 1}
  iepe: {label: IEPE, color: 7}
  ipe:  {label: IPE,  color: 3}
  spo:  {label: SPO,  color: 2}
  hpo:  {label: HPO,  color: 5}

# Published models. Only models listed here (and used by a set below) reach the site.
# `run` is the SFT run directory (run_prefix is prepended unless it already starts with "sft_"),
# `step` its checkpoint. `make report` lists every evaluated checkpoint with its run and step.
# `renamed_from` lists earlier names of a renamed run folder, so evals made before the rename still match.
run_prefix: sft_Llama-3.2-1B_ultrachat_no_refusal_samples100000_seq2048_seed42_
models:
  - {id: epe-011, label: EPE 011 (baseline), method: epe, code: "011", tags: [baseline],
     run: sft-baseline-ultrachat-anchors_20260926_163819, step: 1701}
  - {id: epe-001, label: EPE 001, method: epe, code: "001",
     run: sft-baseline-wo-anchor_20260930_073645, step: 1561}
  - {id: epe-101, label: EPE 101, method: epe, code: "101",
     run: sft-epe-wo-anchor_20260930_093444, step: 1561}
  - {id: epe-111, label: EPE 111, method: epe, code: "111",
     run: sft-epe_20260928_182505, step: 1701}
  - {id: epe-111-meaningful, label: EPE 111-meaningful, method: epe, code: "111", tags: [meaningful],
     run: sft-epe-ultrachat-anchors_20260927_191214, step: 1701}
  - {id: iepe-111, label: IEPE 111, method: iepe, code: "111",
     run: sft-iepe_20260928_174001, step: 1701}
  - {id: iepe-101, label: IEPE 101, method: iepe, code: "101",
