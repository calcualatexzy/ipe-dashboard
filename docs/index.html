<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPE Experiments</title>
  <meta name="description" content="Runs, lineage and evaluation results across IPE experiments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("ipe-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="wordmark" href="#/">IPE <span>Experiments</span></a>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>
  <main id="app" class="wrap" aria-live="polite"></main>
  <footer class="site-footer wrap">
    <span>Generated from IPE outputs by <code>python -m collector</code>.</span>
  </footer>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
